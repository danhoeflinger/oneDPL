name: oneDPL CI On Demand

# Maintains a "Run public CI" checkbox at the bottom of every PR description.
# When a user with write access checks it, this workflow dispatches "oneDPL CI Testing"
# (ci-testing.yml) for the PR head commit and replaces the checkbox with a non-clickable "running" note
# until the run finishes (restored by ci-testing.yml) or a new commit is pushed.
# Results are reported back to the PR as a commit status on the tested commit.
# The shared logic lives in .github/scripts/ci-on-demand.js.
#
# Security notes:
# - pull_request_target runs in the context of the base repository; this workflow never checks out
#   or executes PR code. The PR body is untrusted and is only handled as data inside github-script.
# - The commit SHA that was current when the box was checked is pinned and passed to the dispatched
#   run, so commits pushed after approval are not tested without a new approval.
# - Edits made with GITHUB_TOKEN do not trigger workflows, so updating the description cannot loop.
# - If a run is stuck, deleting the block from the description restores the checkbox.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches:
      - main
      - 'release/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ci-button:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # helper script from the base branch
      actions: write        # dispatch ci-testing.yml
      pull-requests: write  # update the PR description
      statuses: write       # report the pending status on the PR commit
    steps:
      # Base-branch copy of the helper script only; PR code is never checked out here.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts/ci-on-demand.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Maintain button and launch CI on request
        uses: actions/github-script@v9
        with:
          script: |
            const ci = require('./.github/scripts/ci-on-demand.js');
            const { owner, repo } = context.repo;
            const payload = context.payload;
            const prNumber = payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // A click: the box went from unchecked to checked in this edit.
            const requested = payload.action === 'edited' &&
                              payload.changes?.body !== undefined &&
                              ci.parse(payload.pull_request.body).kind === 'checked' &&
                              ci.parse(payload.changes.body.from).kind !== 'checked';

            let authorized = false;
            if (requested) {
              const actor = payload.sender.login;
              let permission = 'none';
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
                permission = data.permission;
              } catch (e) {
                core.info(`Permission lookup for ${actor} failed: ${e.message}`);
              }
              if (payload.pull_request.state !== 'open')
                core.notice('PR is not open; ignoring CI request.');
              else if (!['admin', 'write'].includes(permission))
                core.notice(`${actor} has '${permission}' access; write access is required to launch CI.`);
              else
                authorized = true;
            }

            if (authorized) {
              const pr = payload.pull_request;
              const sha = pr.head.sha;
              const actor = payload.sender.login;

              // Lock the control first so further clicks are impossible while the run is being launched.
              await ci.updateBlock(github, context, prNumber, () => ({ kind: 'running', sha }));
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state: 'pending', context: ci.STATUS_CONTEXT,
                description: `Requested by @${actor}, waiting to start`,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/workflows/${ci.CI_WORKFLOW}?query=event%3Aworkflow_dispatch`,
              });

              // Same-repo PRs dispatch on the PR branch so changes to the CI workflow itself are exercised.
              // Fork branches do not exist in this repository, so they use the workflow from the base branch.
              const refs = pr.head.repo?.full_name === `${owner}/${repo}` ? [pr.head.ref, pr.base.ref] : [pr.base.ref];
              let dispatched = false;
              for (const ref of refs) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: ci.CI_WORKFLOW, ref,
                    inputs: { pr_number: String(prNumber), sha, base_sha: pr.base.sha },
                  });
                  core.notice(`Dispatched ${ci.CI_WORKFLOW} on ref '${ref}' for ${sha} (requested by ${actor}).`);
                  dispatched = true;
                  break;
                } catch (e) {
                  core.warning(`Dispatch on ref '${ref}' failed: ${e.message}`);
                }
              }
              if (!dispatched) {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha, state: 'error', context: ci.STATUS_CONTEXT,
                  description: 'Failed to launch CI', target_url: runUrl,
                });
                await ci.updateBlock(github, context, prNumber, () => ({ kind: 'idle' }));
                core.setFailed('Could not dispatch the CI workflow.');
              }
              return;
            }

            // Otherwise just keep the control in a valid state.
            await ci.updateBlock(github, context, prNumber, (state, pr) => {
              if (state.kind === 'missing' || state.kind === 'checked')
                return { kind: 'idle' };  // add the control, or undo an unauthorized click
              if (state.kind === 'running' && payload.action === 'synchronize' && state.sha !== pr.head.sha)
                return { kind: 'idle' };  // a new commit can be tested right away
              return null;
            });
